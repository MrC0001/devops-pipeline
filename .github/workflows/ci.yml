name: DevOps Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: Deploy to AWS after the checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  application:
    name: Application checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run ESLint
        working-directory: app
        run: npm run lint

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Audit dependencies
        working-directory: app
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infrastructure:
    name: Infrastructure checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Check Terraform format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Initialise Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Python tools
        run: python -m pip install -r ansible/requirements.txt checkov==3.3.11

      - name: Run Checkov
        run: checkov --directory terraform --framework terraform --quiet --compact

      - name: Run ansible-lint
        run: ansible-lint ansible/playbook.yml

      - name: Check Ansible syntax
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: >-
          ansible-playbook
          --inventory ansible/inventory.example.ini
          --syntax-check
          ansible/playbook.yml

  deploy:
    name: Deploy to AWS
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.deploy_to_aws
    needs:
      - application
      - secret-scan
      - infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_KEY_NAME: ${{ vars.EC2_KEY_NAME }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check deployment settings
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          test -n "$AWS_REGION" || { echo "Set the AWS_REGION repository variable."; exit 1; }
          test -n "$EC2_KEY_NAME" || { echo "Set the EC2_KEY_NAME repository variable."; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Add the AWS_ACCESS_KEY_ID secret."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Add the AWS_SECRET_ACCESS_KEY secret."; exit 1; }
          test -n "$AWS_SESSION_TOKEN" || { echo "Add the AWS_SESSION_TOKEN secret."; exit 1; }
          test -n "$EC2_SSH_PRIVATE_KEY" || { echo "Add the EC2_SSH_PRIVATE_KEY secret."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform state
        id: backend
        run: |
          account_id=$(aws sts get-caller-identity --query Account --output text)
          state_bucket="devops-pipeline-state-${account_id}-${AWS_REGION}"

          if ! aws s3api head-bucket --bucket "$state_bucket" 2>/dev/null; then
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$state_bucket" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$state_bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api put-bucket-encryption \
            --bucket "$state_bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-bucket-versioning \
            --bucket "$state_bucket" \
            --versioning-configuration Status=Enabled
          aws s3api put-public-access-block \
            --bucket "$state_bucket" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          echo "state_bucket=$state_bucket" >> "$GITHUB_OUTPUT"

      - name: Get the runner IP
        id: runner
        run: |
          runner_ip=$(curl --retry 5 --fail --silent --show-error https://checkip.amazonaws.com | tr -d '[:space:]')
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "Could not get the runner IP address."; exit 1; }
          echo "ssh_cidr=${runner_ip}/32" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialise Terraform state
        run: >-
          terraform -chdir=terraform init -input=false -reconfigure
          -backend-config="bucket=${{ steps.backend.outputs.state_bucket }}"
          -backend-config="region=$AWS_REGION"

      - name: Create Terraform plan
        run: >-
          terraform -chdir=terraform plan -input=false -out=deployment.tfplan
          -var="aws_region=$AWS_REGION"
          -var="key_name=$EC2_KEY_NAME"
          -var="ssh_cidr=${{ steps.runner.outputs.ssh_cidr }}"

      - name: Apply Terraform plan
        run: terraform -chdir=terraform apply -input=false -auto-approve deployment.tfplan

      - name: Get Terraform outputs
        id: infrastructure
        run: |
          echo "instance_id=$(terraform -chdir=terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "public_ip=$(terraform -chdir=terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          echo "application_url=$(terraform -chdir=terraform output -raw application_url)" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2
        run: aws ec2 wait instance-status-ok --instance-ids "${{ steps.infrastructure.outputs.instance_id }}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible/requirements.txt

      - name: Install Ansible
        run: python -m pip install -r ansible/requirements.txt

      - name: Build the release archive
        id: release
        run: |
          git archive --format=tar.gz --output=devops-pipeline.tgz HEAD:app package.json package-lock.json src public
          app_version=$(node --print "require('./app/package.json').version")
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          PUBLIC_IP: ${{ steps.infrastructure.outputs.public_ip }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$HOME/.ssh/deployment-key.pem"
          chmod 600 "$HOME/.ssh/deployment-key.pem"

          for attempt in {1..30}; do
            if ssh-keyscan -T 5 -H "$PUBLIC_IP" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              break
            fi
            sleep 5
          done

          test -s "$HOME/.ssh/known_hosts" || { echo "Could not read the EC2 host key."; exit 1; }
          printf '[web]\ndevops-server ansible_host=%s ansible_user=ec2-user ansible_ssh_private_key_file=%s\n' \
            "$PUBLIC_IP" "$HOME/.ssh/deployment-key.pem" > ansible/inventory.ini

      - name: Deploy with Ansible
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          RELEASE_ARCHIVE: ${{ github.workspace }}/devops-pipeline.tgz
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          GIT_COMMIT: ${{ github.sha }}
          DEPLOYED_AT: ${{ steps.release.outputs.deployed_at }}
        run: ansible-playbook ansible/playbook.yml

      - name: Assess Ansible idempotence
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          RELEASE_ARCHIVE: ${{ github.workspace }}/devops-pipeline.tgz
          APP_VERSION: ${{ steps.release.outputs.app_version }}
          GIT_COMMIT: ${{ github.sha }}
          DEPLOYED_AT: ${{ steps.release.outputs.deployed_at }}
        run: ansible-playbook ansible/playbook.yml

      - name: Check the deployed app
        env:
          APPLICATION_URL: ${{ steps.infrastructure.outputs.application_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          health=$(curl --retry 12 --retry-all-errors --retry-delay 5 --fail --silent --show-error "$APPLICATION_URL/health")
          version=$(curl --retry 12 --retry-all-errors --retry-delay 5 --fail --silent --show-error "$APPLICATION_URL/version")

          jq --exit-status '.status == "ok"' <<< "$health"
          deployed_commit=$(jq --raw-output '.commit' <<< "$version")
          test "$deployed_commit" = "$EXPECTED_COMMIT" || { echo "The deployed commit does not match this workflow."; exit 1; }

          echo "### Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: $APPLICATION_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $deployed_commit" >> "$GITHUB_STEP_SUMMARY"

      - name: Show service status and recent logs
        if: always()
        continue-on-error: true
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
        run: |
          ansible web --become --module-name command --args "systemctl is-active devops-pipeline nginx"
          ansible web --become --module-name command --args "journalctl -u devops-pipeline --no-pager -n 20"

      - name: Delete the temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deployment-key.pem" ansible/inventory.ini
